<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Enterprise Access Gateway · Predictive IDS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-canvas: #070a12;
            --bg-card: #0d1424;
            --bg-elevated: #131c31;
            --bg-hover: #192540;
            --border-subtle: rgba(255, 255, 255, 0.07);
            --border-base: rgba(255, 255, 255, 0.12);
            --border-focus: #3b82f6;

            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;

            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --status-critical: #ef4444;
            --status-critical-bg: rgba(239, 68, 68, 0.12);
            --status-critical-border: rgba(239, 68, 68, 0.3);

            --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        *, *::before, *::after {
            box-sizing: border-box;
        }

        body.auth-viewport {
            min-height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-canvas);
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(37, 99, 235, 0.18) 0%, transparent 60%),
                radial-gradient(circle at 10% 90%, rgba(30, 58, 138, 0.1) 0%, transparent 40%);
            padding: 24px;
            font-family: var(--font-sans);
            color: var(--text-primary);
            -webkit-font-smoothing: antialiased;
        }

        .auth-container {
            width: 100%;
            max-width: 440px;
        }

        .auth-header {
            margin-bottom: 24px;
            text-align: center;
        }

        .auth-brand-mark {
            width: 44px;
            height: 44px;
            border-radius: 10px;
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.25) 0%, rgba(37, 99, 235, 0.05) 100%);
            border: 1px solid rgba(59, 130, 246, 0.35);
            margin: 0 auto 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 20px rgba(37, 99, 235, 0.2);
        }

        .auth-brand-mark svg {
            width: 22px;
            height: 22px;
            stroke: #3b82f6;
        }

        .auth-title {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-primary);
            margin: 0 0 6px;
            letter-spacing: -0.02em;
        }

        .auth-desc {
            font-size: 13px;
            color: var(--text-secondary);
            margin: 0 0 12px;
        }

        .compliance-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 3px 8px;
            border-radius: 4px;
            font-family: var(--font-mono);
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.05em;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-subtle);
            color: var(--text-muted);
        }

        .compliance-dot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: #10b981;
        }

        .auth-card {
            background: var(--bg-card);
            border: 1px solid var(--border-base);
            border-radius: 10px;
            padding: 28px;
            box-shadow: 0 12px 32px -4px rgba(0, 0, 0, 0.6), inset 0 1px 0 0 rgba(255, 255, 255, 0.06);
        }

        .auth-alert {
            display: none;
            padding: 10px 14px;
            border-radius: 6px;
            font-size: 12px;
            margin-bottom: 18px;
            background: var(--status-critical-bg);
            border: 1px solid var(--status-critical-border);
            color: var(--status-critical);
        }

        .field-group {
            margin-bottom: 18px;
        }

        .field-label {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 12px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 7px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon {
            position: absolute;
            left: 12px;
            width: 15px;
            height: 15px;
            stroke: var(--text-muted);
            pointer-events: none;
        }

        .field-input {
            width: 100%;
            padding: 10px 12px 10px 36px;
            background: var(--bg-canvas);
            border: 1px solid var(--border-base);
            border-radius: 6px;
            color: var(--text-primary);
            font-family: var(--font-sans);
            font-size: 13px;
            outline: none;
            transition: border-color 0.15s, box-shadow 0.15s;
        }

        .field-input:focus {
            border-color: var(--border-focus);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        }

        .btn-submit-auth {
            width: 100%;
            padding: 11px;
            background: var(--primary);
            color: #ffffff;
            border: none;
            border-radius: 6px;
            font-family: var(--font-sans);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s, transform 0.05s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 6px;
        }

        .btn-submit-auth:hover {
            background: var(--primary-hover);
        }

        .btn-submit-auth:active {
            transform: scale(0.99);
        }

        .btn-submit-auth:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* Operator Profiles Section */
        .operator-profiles-section {
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid var(--border-subtle);
        }

        .operator-profiles-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .operator-profiles-title {
            font-size: 10.5px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.06em;
            font-weight: 600;
        }

        .operator-profiles-grid {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .profile-card-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 12px;
            background: var(--bg-elevated);
            border: 1px solid var(--border-subtle);
            border-radius: 6px;
            color: var(--text-secondary);
            cursor: pointer;
            text-align: left;
            transition: all 0.12s;
        }

        .profile-card-btn:hover {
            background: var(--bg-hover);
            border-color: var(--border-base);
            color: var(--text-primary);
        }

        .profile-card-meta {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .profile-card-name {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .profile-card-desc {
            font-size: 10.5px;
            color: var(--text-muted);
        }

        .profile-role-tag {
            font-family: var(--font-mono);
            font-size: 10px;
            font-weight: 600;
            padding: 2px 6px;
            border-radius: 3px;
            text-transform: uppercase;
        }

        .profile-role-tag.admin {
            background: rgba(239, 68, 68, 0.15);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .profile-role-tag.analyst {
            background: rgba(59, 130, 246, 0.15);
            color: #3b82f6;
            border: 1px solid rgba(59, 130, 246, 0.3);
        }

        .profile-role-tag.viewer {
            background: rgba(100, 116, 139, 0.15);
            color: #94a3b8;
            border: 1px solid rgba(100, 116, 139, 0.3);
        }

        .auth-footer {
            margin-top: 24px;
            text-align: center;
            font-size: 11px;
            color: var(--text-muted);
            font-family: var(--font-mono);
        }
    </style>
</head>

<body class="auth-viewport">
    <div class="auth-container">
        <div class="auth-header">
            <div class="auth-brand-mark">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                </svg>
            </div>
            <h1 class="auth-title">Predictive IDS Enterprise</h1>
            <p class="auth-desc">Autonomous Network Telemetry & Threat Classification</p>
            <div class="compliance-pill">
                <span class="compliance-dot"></span>
                <span>FIPS 140-3 · SOC 2 TYPE II ENCLAVE</span>
            </div>
        </div>

        <div class="auth-card">
            <div id="loginAlert" class="auth-alert"></div>

            <form id="loginForm">
                <div class="field-group">
                    <label class="field-label" for="username">
                        <span>Operator Username</span>
                    </label>
                    <div class="input-wrapper">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                            <circle cx="12" cy="7" r="4"/>
                        </svg>
                        <input type="text" id="username" class="field-input" autocomplete="username" required autofocus placeholder="name@soc.enterprise">
                    </div>
                </div>

                <div class="field-group">
                    <label class="field-label" for="password">
                        <span>Access Key / Password</span>
                    </label>
                    <div class="input-wrapper">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                        </svg>
                        <input type="password" id="password" class="field-input" autocomplete="current-password" required placeholder="••••••••••••">
                    </div>
                </div>

                <button type="submit" id="submitBtn" class="btn-submit-auth">
                    <span>Authenticate Session</span>
                    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="5" y1="12" x2="19" y2="12"/>
                        <polyline points="12 5 19 12 12 19"/>
                    </svg>
                </button>
            </form>

            <div class="operator-profiles-section">
                <div class="operator-profiles-header">
                    <span class="operator-profiles-title">Operator Profiles (Quick Fill)</span>
                    <span style="font-size:10.5px; color:var(--text-muted); font-family:var(--font-mono);">Pre-configured</span>
                </div>
                <div class="operator-profiles-grid">
                    <button type="button" class="profile-card-btn" onclick="fillCreds('admin', 'admin123')">
                        <div class="profile-card-meta">
                            <span class="profile-card-name">SecOps Lead</span>
                            <span class="profile-card-desc">Full System Admin · Telemetry, Ingestion, IAM</span>
                        </div>
                        <span class="profile-role-tag admin">admin</span>
                    </button>
                    <button type="button" class="profile-card-btn" onclick="fillCreds('analyst', 'analyst123')">
                        <div class="profile-card-meta">
                            <span class="profile-card-name">SOC Analyst</span>
                            <span class="profile-card-desc">Threat Triage, Incident Mitigation, XAI</span>
                        </div>
                        <span class="profile-role-tag analyst">analyst</span>
                    </button>
                    <button type="button" class="profile-card-btn" onclick="fillCreds('viewer', 'viewer123')">
                        <div class="profile-card-meta">
                            <span class="profile-card-name">Compliance Auditor</span>
                            <span class="profile-card-desc">Telemetry Observer · Read-Only Access</span>
                        </div>
                        <span class="profile-role-tag viewer">viewer</span>
                    </button>
                </div>
            </div>
        </div>

        <div class="auth-footer">
            PIDS v2.4.0 · STRICT RBAC ENFORCED · SESSION EXPIRY 8H
        </div>
    </div>

    <script>
        function fillCreds(u, p) {
            const uField = document.getElementById("username");
            const pField = document.getElementById("password");
            uField.value = u;
            pField.value = p;
            const alert = document.getElementById("loginAlert");
            alert.style.display = "none";
            uField.focus();
        }

        // Redirect if already authenticated
        fetch("/api/auth/me")
            .then(res => {
                if (res.ok) window.location.href = "/";
            })
            .catch(() => {});

        document.getElementById("loginForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const btn = document.getElementById("submitBtn");
            const alert = document.getElementById("loginAlert");
            const username = document.getElementById("username").value.trim();
            const password = document.getElementById("password").value;

            btn.disabled = true;
            btn.innerHTML = `<span>Validating credentials…</span>`;
            alert.style.display = "none";

            try {
                const res = await fetch("/api/auth/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ username, password })
                });

                const data = await res.json();
                if (!res.ok) {
                    alert.textContent = data.detail || "Authentication failed: Invalid credentials.";
                    alert.style.display = "block";
                    btn.disabled = false;
                    btn.innerHTML = `<span>Authenticate Session</span><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>`;
                    return;
                }

                window.location.href = "/";
            } catch (err) {
                alert.textContent = "Unable to contact authentication gateway.";
                alert.style.display = "block";
                btn.disabled = false;
                btn.innerHTML = `<span>Authenticate Session</span><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>`;
            }
        });
    </script>
</body>

</html>
